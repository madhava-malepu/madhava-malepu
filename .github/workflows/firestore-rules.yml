name: firestore-rules

on:
  push:
    paths: ['firestore.rules', 'rules-tests/**']
  pull_request:
    paths: ['firestore.rules', 'rules-tests/**']

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
        working-directory: rules-tests
      - name: Rules tests in the Firestore emulator (attacks blocked, app flows allowed)
        run: npm test
        working-directory: rules-tests
