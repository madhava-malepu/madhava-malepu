name: surpl
description: Rescue food. Save money.
publish_to: 'none'
# Must be higher than the last build uploaded to either store (iOS build was 33).
version: 1.0.0+34

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Firebase — pinned as one release train: firebase_core 3.14.0 = iOS SDK 11.13.0,
  # which ios/Podfile's precompiled FirebaseFirestore (tag 11.13.0) must match.
  firebase_core: 3.14.0
  cloud_firestore: 5.6.9
  firebase_auth: 5.6.0
  firebase_storage: 12.4.7
  cloud_functions: 5.5.2
  firebase_messaging: 15.2.7
  firebase_performance: 0.10.1+7

  # Sign-in, payments, device
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  razorpay_flutter: ^1.3.7
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

  # UI + utilities
  provider: ^6.1.2
  go_router: ^12.1.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  auto_size_text: ^3.0.0
  page_transition: ^2.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  dropdown_button2: ^2.3.9
  from_css_color: ^2.0.0
  timeago: ^3.7.0
  intl: any
  collection: any
  rxdart: ^0.28.0
  uuid: ^4.4.2
  crypto: ^3.0.3
  json_path: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # CocoaPods only: firebase, maps, notifications and Sign in with Apple are
  # linked through Pods; letting Swift Package Manager add Firebase as well
  # links it twice (duplicate symbols).
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
